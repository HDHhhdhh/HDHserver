name: Refactor safety

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check "Flask==3.1.3" "gdown==6.1.0" "PyJWT==2.13.0"

      - name: Compile Python
        run: python -m compileall -q app.py routes core scripts

      - name: Run safety verification
        run: python scripts/verify_refactor_safety.py

  verify-student-deployment-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up deployment Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create fixture virtual environment
        shell: pwsh
        run: python -m venv venv

      - name: Run full student deployment contract
        shell: pwsh
        run: .\venv\Scripts\python.exe -X utf8 .\scripts\verify_refactor_safety.py --only-student-mobile-deployment
