<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>학생 홈</title>
  <style>
    :root{
      --bg:#0b0f1a; --card:#121a2a; --line:#27314a; --text:#e8ecff; --muted:#98a2c3;
      --accent:#6aa6ff; --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{margin:0; background:linear-gradient(180deg,#060916,#0b0f1a); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; letter-spacing:0; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; font-variant-numeric:tabular-nums}
    header{padding:18px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center}
    .wrap{max-width:980px; margin:0 auto; padding:16px}
    .grid{display:grid; grid-template-columns:1.2fr .8fr; gap:14px}
    @media(max-width:860px){ .grid{grid-template-columns:1fr} }
    .card{background:rgba(18,26,42,.92); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 18px 50px rgba(0,0,0,.35)}
    h1{font-size:18px; margin:0}
    h2{font-size:14px; margin:0 0 12px; color:var(--muted)}
    .pill{display:inline-flex; gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:999px; background:#0f1526; color:var(--muted); font-size:12px}
    .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:0; border-radius:12px; padding:10px 12px; cursor:pointer; font-family:inherit; font-weight:800; line-height:1; text-align:center}
    .btnA{background:var(--accent); color:#071022}
    .btnB{background:#1b2440; color:var(--text); border:1px solid var(--line)}
    label{display:block; font-size:12px; color:var(--muted); margin:10px 0 6px}
    input{width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:#0f1526; color:var(--text); outline:none; font:inherit}
    .row{display:flex; gap:10px; margin-top:10px}
    .msg{margin-top:10px; font-size:13px}
    .err{color:var(--danger)}
    .ok{color:#7dffa5}
    .muted{color:var(--muted); font-size:13px; line-height:1.5}
  </style>
</head>
<body>
  <header>
    <h1>학생 홈</h1>
    <div style="display:flex; gap:10px; align-items:center">
      <span class="pill">로그인 <b id="sidText">-</b></span>
      <button class="btn btnB" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="wrap">
    <div class="grid">
      <div class="card">
        <h2>바로가기 (임시 메뉴)</h2>
        <div class="muted">
          여기에는 앞으로 <b>진도표</b>, <b>공지사항</b>, <b>학습자료</b> 같은 메뉴를 연결할 수 있습니다.<br>
          (학생별 페이지는 아래 링크에서 연결합니다.)
        </div>
        <div class="row" style="margin-top:14px">
          <a class="btn btnB" href="/student/" onclick="return false;" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; flex:1; opacity:.6">
            학생 페이지 (준비 중)
          </a>
          <a class="btn btnB" href="/tests" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center; flex:1">
            테스트
          </a>
        </div>
      </div>

      <div class="card">
        <h2>아이디 / 비밀번호 변경</h2>

        <div class="muted">
          - 비밀번호를 변경하면 앞으로는 <b>1234로 로그인할 수 없습니다.</b><br>
          - 아이디 변경은 연결된 학생 정보 전체에 반영되니 신중하게 변경해 주세요.
        </div>

        <hr style="border:0; border-top:1px solid var(--line); margin:14px 0">

        <h2>비밀번호 변경</h2>
        <label>현재 비밀번호</label>
        <input id="oldPw" type="password" placeholder="1234">
        <label>새 비밀번호</label>
        <input id="newPw" type="password" placeholder="최소 4자리">
        <div class="row">
          <button class="btn btnA" id="pwBtn">비밀번호 변경</button>
        </div>

        <hr style="border:0; border-top:1px solid var(--line); margin:14px 0">

        <h2>아이디 변경</h2>
        <label>비밀번호 확인</label>
        <input id="idPw" type="password" placeholder="비밀번호">
        <label>새 아이디 (영문/숫자/밑줄, 3~20자)</label>
        <input id="newId" placeholder="aaa123">
        <div class="row">
          <button class="btn btnB" id="idBtn">아이디 변경</button>
        </div>

        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
