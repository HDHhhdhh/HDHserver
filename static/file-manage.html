<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>파일 관리</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-light: #ffffff;
      --card-dark: #111827;
      --text: #20242c;
      --text-dark: #e5e7eb;
      --muted: #5d6878;
      --line: #d9dee7;
      --accent: #1769aa;
      --danger: #b42318;
      --ok: #16835d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-variant-numeric: tabular-nums;
    }
    .shell { max-width: 1440px; margin: 0 auto; padding: 14px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card-light);
      box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 10px 24px rgba(15, 23, 42, .07);
      padding: 12px;
    }
    h1 { margin: 0; font-size: 22px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }
    .panel {
      background: var(--card-light);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }
    .toolbar, .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar { margin-bottom: 10px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      box-sizing: border-box;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      text-decoration: none;
      line-height: 1;
      text-align: center;
      vertical-align: middle;
      transition: transform 150ms cubic-bezier(.2, 0, 0, 1), background-color 150ms cubic-bezier(.2, 0, 0, 1), border-color 150ms cubic-bezier(.2, 0, 0, 1), box-shadow 150ms cubic-bezier(.2, 0, 0, 1), color 150ms cubic-bezier(.2, 0, 0, 1);
    }
    .btn:active { transform: scale(.96); }
    .btn:hover { background: #f1f5f9; }
    .btn.primary, .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { background: #fff; border-color: #fecaca; color: var(--danger); }
    .btn.small { min-height: 36px; padding: 5px 8px; font-size: 12px; }
    .btn.ghost { background: transparent; }
    input, select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 9px;
      min-height: 40px;
      background: #fff;
      color: var(--text);
      font: inherit;
      transition: border-color 150ms cubic-bezier(.2, 0, 0, 1), box-shadow 150ms cubic-bezier(.2, 0, 0, 1), background-color 150ms cubic-bezier(.2, 0, 0, 1);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 105, 170, .16);
    }
    .ctx-i {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      line-height: 1.2;
    }
    #newFolderName { width: 170px; }
    #drop {
      border: 1px dashed #9ca3af;
      border-radius: 8px;
      background: #f8fafc;
      padding: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      text-align: center;
    }
    #drop.drag, .drop-target { outline: 2px solid var(--accent); outline-offset: 2px; background: #eff6ff; }
    .file-grid {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 12px;
      min-height: 620px;
    }
    .tree, .list {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      background: #fff;
    }
    .tree { padding: 8px; }
    .tree-row { border-radius: 8px; padding: 3px 5px; }
    .tree-row:hover { background: #eef2ff; }
    .pathbar { display: flex; gap: 6px; align-items: center; color: var(--muted); margin-bottom: 8px; }
    #curPath { color: var(--text); font-weight: 700; overflow-wrap: anywhere; }
    #list { min-height: 560px; }
    #list table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #list th, #list td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; }
    #list tr.sel { background: #dbeafe; }
    #list tr:hover { background: #f8fafc; }
    .assign-panel { position: sticky; top: 12px; }
    .section-title { margin: 12px 0 7px; font-size: 13px; font-weight: 700; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      background: #fff;
    }
    #amLvWrap, #amMatList, #amCurList, #amStuList {
      display: grid;
      gap: 6px;
      max-height: 210px;
      overflow: auto;
    }
    #amStuList, #amCurList { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .assign-stu { border: 1px solid var(--line); border-radius: 8px; padding: 7px; background: #fff; }
    .muted { color: var(--muted); }
    @media (max-width: 1080px) {
      .layout { grid-template-columns: 1fr; }
      .assign-panel { position: static; }
      .file-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1>파일 관리</h1>
      <nav class="links" aria-label="관리 링크">
        <a class="btn" href="/admin">관리</a>
        <a class="btn" href="/students">전체 학생</a>
        <a class="btn" href="/video-manage">영상 관리</a>
      </nav>
    </header>

    <main class="layout">
      <section class="panel" aria-label="파일 브라우저">
        <div class="toolbar">
          <button id="btnRefresh" class="btn" type="button">새로고침</button>
          <input id="newFolderName" placeholder="새 폴더명" autocomplete="off">
          <button id="btnMake" class="btn" type="button">폴더 생성</button>
          <button id="btnRename" class="btn" type="button">이름 변경</button>
          <button id="btnMove" class="btn" type="button">이동</button>
          <button id="btnDelete" class="btn danger" type="button">삭제</button>
          <button id="btnUpload" class="btn primary" type="button">업로드</button>
          <input id="fileInput" type="file" multiple hidden>
        </div>

        <div id="drop">이곳으로 파일을 끌어오면 현재 폴더에 업로드됩니다.</div>

        <div class="file-grid">
          <aside id="tree" class="tree" aria-label="폴더 트리"></aside>
          <section class="list" aria-label="파일 목록">
            <div class="pathbar">현재 위치 <span id="curPath">/</span></div>
            <div id="list"></div>
          </section>
        </div>
      </section>

      <aside class="panel assign-panel" aria-label="자료 배정">
        <div class="seg">
          <button id="modeAdd" class="btn on" type="button">배정</button>
          <button id="modeRemove" class="btn" type="button">해제</button>
        </div>

        <div class="section-title">대상 학생</div>
        <div class="filters">
          <select id="amCur"><option value="">전체 커리큘럼</option></select>
          <select id="amSub"><option value="">전체 세부과정</option></select>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="amLvAll" class="btn small" type="button">레벨 전체</button>
          <span id="amStuCount" class="muted">(0명)</span>
        </div>
        <div id="amLvWrap" style="margin-top:8px"></div>
        <div id="amStuList" style="margin-top:8px"></div>

        <div id="boxAdd">
          <div class="section-title">배정할 파일/폴더</div>
          <div class="row" style="margin-bottom:8px">
            <button id="amPickClear" class="btn small" type="button">목록 비우기</button>
          </div>
          <div id="amMatList">
            <div class="muted">왼쪽 목록에서 파일이나 폴더를 끌어오세요.</div>
          </div>
        </div>

        <div id="boxRemove" style="display:none">
          <div class="section-title">현재 배정된 항목</div>
          <div class="row" style="margin-bottom:8px">
            <button id="rmAll" class="btn small" type="button">전체 선택</button>
            <button id="rmNone" class="btn small" type="button">해제</button>
          </div>
          <div id="amCurList"></div>
        </div>

        <button id="amDoAssign" class="btn primary" type="button" style="width:100%;margin-top:12px">실행</button>
      </aside>
    </main>
  </div>

  <script src="/js/file-manage.js?v=20260509a"></script>
</body>
</html>
