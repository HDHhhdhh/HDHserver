<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e77ec">
  <meta name="description" content="학생용 학습 공간">
  <title>학생 학습 공간</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/student-app-192.png" type="image/png">
  <link rel="stylesheet" href="/css/student-app.css">
  <script type="module" src="/js/student-app.js"></script>
</head>
<body class="student-app-page">
  <a class="skip-link" href="#student-app">본문으로 건너뛰기</a>
  <header class="student-app-header" aria-label="학생 앱 머리말">
    <a class="student-app-brand" href="/student-app.html" aria-label="학생 앱 처음으로">
      <img src="/icons/student-app-192.png" width="40" height="40" alt="">
      <span>학생 학습 공간</span>
    </a>
    <span class="student-app-header-note">안전한 학습 연결</span>
  </header>

  <main id="student-app" role="main" aria-live="polite" aria-atomic="true">
    <section class="student-app-state" data-state="signed_out" tabindex="-1" role="region" aria-labelledby="student-app-state-title">
      <p class="student-app-eyebrow">학생 앱</p>
      <h1 id="student-app-state-title" class="student-app-title">학습을 시작해 주세요</h1>
      <p id="student-app-state-help" class="student-app-copy">등록된 학생 계정으로 안전하게 연결합니다.</p>
      <p class="student-app-status" data-app-status role="status" aria-live="polite"></p>
      <button class="student-app-primary" data-primary-action="sign-in" type="button" aria-describedby="student-app-state-help">로그인</button>
    </section>
  </main>

  <footer class="student-app-footer">
    <span>학생용 학습 공간</span>
    <span aria-hidden="true">·</span>
    <span>연결 상태는 화면에 안내됩니다.</span>
  </footer>

  <noscript>
    <div class="student-app-noscript" role="status">이 앱을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</div>
  </noscript>
</body>
</html>
