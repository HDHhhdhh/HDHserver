<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e77ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="학생 앱">
  <meta name="description" content="학생용 학습 공간">
  <title>학생 학습 공간</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/student-app-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/student-app-192.png">
  <link rel="stylesheet" href="/css/student-app.css">
  <script type="module" src="/js/student-app.js"></script>
</head>
<body class="student-app-page">
  <a class="skip-link" href="#student-app">본문으로 건너뛰기</a>
  <header class="student-app-header" aria-label="학생 앱 머리말">
    <a class="student-app-brand" href="/app" aria-label="학생 앱 처음으로">
      <img src="/icons/student-app-192.png" width="40" height="40" alt="">
      <span>학생 학습 공간</span>
    </a>
    <div class="student-app-header-actions">
      <span class="student-app-header-note">안전한 학습 연결</span>
      <button class="student-app-install-link" data-install-guide-open type="button" aria-haspopup="dialog" aria-controls="student-app-install-dialog">앱 설치 안내</button>
    </div>
  </header>

  <main id="student-app" role="main">
    <section class="student-app-state" data-state="signed_out" tabindex="-1" role="region" aria-labelledby="student-app-state-title">
      <p class="student-app-eyebrow">학생 앱</p>
      <h1 id="student-app-state-title" class="student-app-title">학습을 시작해 주세요</h1>
      <p id="student-app-state-help" class="student-app-copy">기존 학생 아이디 또는 이름과 비밀번호를 입력해 주세요. 기존 사이트의 로그인 상태는 앱으로 자동 이동하지 않습니다.</p>
      <p class="student-app-status" data-app-status role="status" aria-live="polite"></p>
      <button class="student-app-primary" data-primary-action="sign-in" type="button" aria-describedby="student-app-state-help">로그인</button>
    </section>
  </main>

  <footer class="student-app-footer">
    <span>학생용 학습 공간</span>
    <span aria-hidden="true">·</span>
    <span>연결 상태는 화면에 안내됩니다.</span>
  </footer>

  <div class="student-app-install-overlay" data-install-guide hidden>
    <section id="student-app-install-dialog" class="student-app-install-dialog" data-install-dialog role="dialog" aria-modal="true" aria-labelledby="student-app-install-title" aria-describedby="student-app-install-body" tabindex="-1">
      <button class="student-app-install-close" data-install-dismiss type="button" aria-label="앱 설치 안내 닫기">×</button>
      <p class="student-app-install-environment" data-install-environment>현재 기기 · 현재 브라우저</p>
      <h2 id="student-app-install-title" class="student-app-install-title" data-install-title>학생 앱을 설치해 주세요</h2>
      <p id="student-app-install-body" class="student-app-install-body" data-install-body>기기에 맞는 설치 방법을 확인해 주세요.</p>
      <ol class="student-app-install-steps" data-install-steps tabindex="-1">
        <li>브라우저 메뉴에서 앱 설치 또는 홈 화면에 추가를 선택하세요.</li>
        <li>설치를 완료한 뒤 새 학생 앱 아이콘으로 다시 여세요.</li>
      </ol>
      <p class="student-app-install-status" data-install-status role="status" aria-live="polite"></p>
      <div class="student-app-install-buttons">
        <button class="student-app-primary student-app-install-primary" data-install-action type="button">앱 설치 시도</button>
        <button class="student-app-secondary" data-install-dismiss type="button">나중에</button>
      </div>
    </section>
  </div>

  <noscript>
    <div class="student-app-noscript" role="status">이 앱을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</div>
  </noscript>
</body>
</html>
