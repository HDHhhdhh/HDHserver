<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학교 일정 관리</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --sc-bg: #f4f6f8;
      --sc-surface: #ffffff;
      --sc-line: #d9dee7;
      --sc-line-strong: #c4ccd8;
      --sc-text: #20242c;
      --sc-muted: #5d6878;
      --sc-accent: #1769aa;
      --sc-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 12px 28px rgba(15, 23, 42, .08);
    }

    body {
      margin: 0 auto;
      max-width: min(1680px, calc(100vw - 24px));
      padding: 14px 0 24px;
      background: var(--sc-bg);
      color: var(--sc-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-variant-numeric: tabular-nums;
    }

    body.dark {
      --sc-bg: #0f1727;
      --sc-surface: #16253b;
      --sc-line: #2f4665;
      --sc-line-strong: #3f5e87;
      --sc-text: #e7f0fe;
      --sc-muted: #9fb5d2;
      --sc-accent: #6ea8ff;
      --sc-shadow: 0 18px 36px rgba(0, 0, 0, 0.3);
    }

    .cal-shell {
      background: var(--sc-surface);
      border: 1px solid var(--sc-line);
      border-radius: 8px;
      box-shadow: var(--sc-shadow);
      padding: 14px;
    }

    .topbar-cal {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.25rem, 2.4vw, 1.8rem);
      letter-spacing: 0;
    }

    .title-sub {
      margin: 6px 0 0;
      color: var(--sc-muted);
      font-size: 13px;
    }

    .link-back {
      display: inline-flex;
      margin-top: 8px;
      color: var(--sc-accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .link-back:hover { text-decoration: underline; }

    .tool-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tool-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-row > .tool-group:first-child {
      order: 2;
      margin-left: auto;
    }

    .tool-row > .tool-group:last-child {
      order: 1;
      margin-right: auto;
    }

    .field-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--sc-muted);
      font-size: 12px;
      font-weight: 800;
    }

    .select-field,
    .search-field {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--sc-line-strong);
      background: var(--sc-surface);
      color: var(--sc-text);
      padding: 0 10px;
      font-weight: 700;
      box-sizing: border-box;
    }

    .search-field {
      width: min(320px, 48vw);
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--sc-line-strong);
      background: var(--sc-surface);
      color: var(--sc-text);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      text-align: center;
      transition: transform 150ms cubic-bezier(.2, 0, 0, 1), background-color 150ms cubic-bezier(.2, 0, 0, 1), border-color 150ms cubic-bezier(.2, 0, 0, 1), box-shadow 150ms cubic-bezier(.2, 0, 0, 1);
    }

    .btn:active { transform: scale(.96); }

    .btn.primary {
      background: color-mix(in srgb, var(--sc-accent) 86%, #ffffff 14%);
      border-color: color-mix(in srgb, var(--sc-accent) 78%, #000000 22%);
      color: #f8fbff;
    }

    .status-chip {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--sc-line);
      color: var(--sc-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--sc-line-strong);
      border-radius: 8px;
      overflow: hidden;
      background: var(--sc-surface);
    }

    .seg button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: var(--sc-text);
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      transition: transform 150ms cubic-bezier(.2, 0, 0, 1), background-color 150ms cubic-bezier(.2, 0, 0, 1), color 150ms cubic-bezier(.2, 0, 0, 1);
    }

    .seg button:active { transform: scale(.96); }

    .seg button.active {
      background: color-mix(in srgb, var(--sc-accent) 85%, #ffffff 15%);
      color: #f6fbff;
    }

    .table-card {
      margin-top: 12px;
      border: 1px solid var(--sc-line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--sc-surface) 90%, #ffffff 10%);
      padding: 10px;
    }

    .table-note {
      margin: 0 0 8px;
      color: var(--sc-muted);
      font-size: 12px;
      font-weight: 600;
    }

    #wrap {
      overflow: auto;
      border-radius: 8px;
    }

    .tbl {
      width: 100%;
      min-width: 1500px;
      border-collapse: separate;
      border-spacing: 0;
    }

    .tbl th, .tbl td {
      border-bottom: 1px solid var(--sc-line);
      padding: 10px 8px;
      vertical-align: middle;
      text-align: left;
    }

    .tbl th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--sc-surface) 82%, #ffffff 18%);
      color: var(--sc-text);
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      body {
        max-width: calc(100vw - 10px);
        padding-top: 8px;
      }

      .cal-shell {
        padding: 10px;
        border-radius: 8px;
      }

      .tool-row {
        align-items: stretch;
      }

      :where(.btn, .link-back, .select-field, .search-field, .seg button) {
        min-height: 44px;
      }
    }
  </style>
</head>
<body class="school-calendar-page">
  <div class="cal-shell">
    <header class="topbar-cal">
      <div class="title-wrap">
        <h1>학교 일정 관리</h1>
        <p class="title-sub">학교/학년/과목(트랙)별 시험 일정과 범위를 관리합니다.</p>
      </div>
      <label class="switch" style="margin:0">
        <input type="checkbox" id="darkToggle"><span class="slider"></span>
      </label>
    </header>

    <a href="/admin" class="link-back">관리자 화면으로 돌아가기</a>

    <div class="tool-row">
      <div class="tool-group">
        <button id="addRow" class="btn primary" type="button">+ 학교 추가</button>
        <button id="saveBtn" class="btn" type="button">저장</button>
        <span id="status" class="status-chip" aria-live="polite"></span>
      </div>
      <div class="tool-group">
        <label class="field-label">년도
          <select id="yearSelect" class="select-field"></select>
        </label>
        <label class="field-label">학기
          <select id="semesterSelect" class="select-field">
            <option value="1">1학기</option>
            <option value="2">2학기</option>
          </select>
        </label>
        <label class="field-label">시험
          <select id="examSelect" class="select-field">
            <option value="mid">중간고사</option>
            <option value="final">기말고사</option>
          </select>
        </label>
        <input id="calSearch" class="search-field" type="search" autocomplete="off" placeholder="학교/과목/교과서 검색">
        <span id="searchStatus" class="status-chip" aria-live="polite"></span>
      </div>
    </div>

    <section class="table-card">
      <p class="table-note">같은 학년도 과목/트랙이 다르면 별도 행으로 입력하세요. (예: 2학년 · 수학1 / 2학년 · 미적분)</p>
      <div id="wrap">
        <table class="tbl" id="calTable">
          <thead><tr id="theadRow"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const t = document.getElementById('darkToggle');
      if (localStorage.theme === 'dark') {
        document.body.classList.add('dark');
        t.checked = true;
      }
      t.addEventListener('change', () => {
        document.body.classList.toggle('dark', t.checked);
        localStorage.theme = t.checked ? 'dark' : 'light';
      });
    })();
  </script>
  <script type="module" src="/js/admin/demo/bootstrap.js?v=20260617t3b"></script>
  <script type="module" src="/js/school-cal.js"></script>
</body>
</html>
