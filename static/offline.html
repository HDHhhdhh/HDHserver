<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e77ec">
  <title>오프라인 안내</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: light dark; font-family: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; color: #16253b; background: #f7fbff; overflow-x: clip; }
    @media (prefers-color-scheme: dark) { :root { color: #e6f0ff; background: #0b1423; } }
    body { min-block-size: 100dvh; inline-size: 100%; max-inline-size: 100%; margin: 0; display: grid; place-items: center; padding: 24px; word-break: keep-all; overflow-wrap: break-word; text-wrap: pretty; }
    main { inline-size: min(100%, 480px); max-inline-size: 100%; min-inline-size: 0; padding: 32px; border: 1px solid #b8cde8; border-radius: 20px; background: color-mix(in srgb, #fff 92%, transparent); box-shadow: 0 18px 48px rgba(16, 38, 68, .14); }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 7vw, 36px); line-height: 1.2; word-break: keep-all; overflow-wrap: break-word; text-wrap: pretty; }
    p { margin: 0; color: #5f7697; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; text-wrap: pretty; }
    a { display: inline-flex; max-inline-size: 100%; min-block-size: 48px; align-items: center; justify-content: center; margin-block-start: 24px; padding-inline: 16px; border-radius: 12px; background: #2e77ec; color: #fff; font-weight: 800; text-decoration: none; white-space: nowrap; }
    a:focus-visible { outline: 3px solid #2e77ec; outline-offset: 3px; }
  </style>
</head>
<body>
  <main role="main" aria-labelledby="offline-title">
    <p aria-hidden="true">학생 학습 공간</p>
    <h1 id="offline-title">오프라인 상태입니다</h1>
    <p>인터넷 연결을 확인한 뒤 학생 앱을 다시 열어 주세요. 저장된 학습 자료는 자동으로 대신 제공하지 않습니다.</p>
    <a href="/student-app.html">다시 시도</a>
  </main>
</body>
</html>
