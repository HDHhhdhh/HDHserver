<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 12 Student Link QA</title>
  <link rel="stylesheet" href="../../static/css/student.css">
  <script>
    const params = new URLSearchParams(location.search);
    const restricted = params.get('restricted') === '1';
    const answerUrl = 'https://drive.google.com/file/d/TEST_SOLUTION_FILE_ID_20260606/view';
    const qaLabel = 'UNIT-LINK-QA-2026-06-06';
    window.__alerts = [];
    window.__openCalls = [];
    window.alert = message => {
      window.__alerts.push(String(message || ''));
      document.body?.setAttribute('data-last-alert', String(message || ''));
    };
    window.open = (url, target) => {
      const record = { url: String(url || ''), target: String(target || '') };
      window.__openCalls.push(record);
      return {
        opener: null,
        closed: false,
        close() { this.closed = true; },
        location: {
          replace(nextUrl) { record.replacedWith = String(nextUrl || ''); },
        },
      };
    };
    window.fetch = async input => {
      const url = String(input || '');
      const json = body => Promise.resolve({
        ok: true,
        status: 200,
        json: async () => body,
        text: async () => JSON.stringify(body),
      });
      if (url.includes('/api/student/bootstrap')) {
        return json({
          ok: true,
          student: { id: '007', name: 'QA Student' },
          students: [{ id: '007', name: 'QA Student' }],
          videos: [],
          updates: {},
          materials: {},
          assigns: {},
          absent: {},
          logs: {},
          watch: {},
          courseBlocked: false,
          courseVideosCompleted: false,
          academyAccessAllowed: !restricted,
          outsideAcademyBlocked: restricted,
          academyOnlyMessage: 'academy access required',
          assignedTests: [{
            id: 'unit-link',
            label: qaLabel,
            name: qaLabel,
            category: 'UNIT',
            categoryLabel: 'UNIT',
            round: '1',
            status: 'assigned',
            answerUrl,
            answerRestricted: restricted,
          }],
          homeworkBooks: [],
        });
      }
      if (url.includes('/api/watch/latest')) return json({});
      return json({ ok: true });
    };
    function captureQaStatus() {
      const action = document.querySelector('#assignedTestList .assigned-test-btn[data-answer-url]');
      const panel = document.getElementById('assignedTestsPanel');
      const qa = {
        restricted,
        panelVisible: !!panel && panel.hidden === false,
        tagName: action?.tagName || '',
        href: action?.getAttribute('href') || '',
        dataAnswerUrl: action?.getAttribute('data-answer-url') || '',
        dataRestricted: action?.getAttribute('data-answer-restricted') || '',
        text: document.getElementById('assignedTestList')?.textContent || '',
        alerts: window.__alerts.length,
        openCalls: window.__openCalls.length,
        url: location.href,
      };
      document.body.setAttribute('data-qa-status', JSON.stringify(qa));
    }
    window.__captureTask12QaStatus = captureQaStatus;
  </script>
</head>
<body>
  <header class="namebar">
    <div>
      <h1 id="studentName">QA Student</h1>
      <p class="namebar-desc">Task 12 fixture</p>
    </div>
    <button id="openTestSubmit" class="ts-btn" type="button" hidden>테스트 제출</button>
  </header>
  <main class="student-main">
    <section class="panel tests-panel" id="assignedTestsPanel" hidden>
      <h3 class="section-title">오늘 테스트</h3>
      <ul id="assignedTestList">
        <li class="muted">테스트를 불러오는 중...</li>
      </ul>
    </section>
    <section class="panel" id="studentHomeworkPanel" hidden>
      <ul id="studentHomeworkBooks"></ul>
    </section>
    <section id="videoList"></section>
    <section id="matList"></section>
    <div id="clock"></div>
  </main>
  <script src="../../static/js/student.js"></script>
  <script>
    setTimeout(() => {
      if (restricted) {
        const action = document.querySelector('#assignedTestList .assigned-test-btn[data-answer-url]');
        action?.click();
      }
      setTimeout(() => window.__captureTask12QaStatus?.(), 300);
    }, 1500);
  </script>
</body>
</html>
